<h2 id="syllabus-update-late-policy">Syllabus Update: Late Policy</h2>
<p>The syllabus has a new late policy for participation assignments:</p>
<p>All participation assignments submitted after the due date will receive a 5% penalty per day, for up to 3 days. After the third day, the assignment will receive a zero, with no opportunity for a regrade.</p>

<h2 id="late-policy-exceptions">Late Policy: Exceptions</h2>
<p>There are two exceptions to this policy:</p>
<ol>
<li>You have received an extension from the instructor.</li>
<li>You contacted me before the due date because you were experiencing a genuine problem that could not be easily resolved.</li>
</ol>
<p>A genuine problem is one that requires assistance or troubleshooting beyond a simple oversight. For example, forgetting to start your VM is not considered a genuine problem.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="use-a-function">Use a Function</h2>
<p>Later, we'll cover how to write and use a function. You must do it in this format for the exercises this week:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">functionName</span>(<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;hi&quot;</span>);
}
</code></pre>
<p>Which is to say, use <code>function</code> to declare functions, not arrow format.</p>
<blockquote>
<p><strong>IMPORTANT:</strong> No credit will be given if this exercise does not use a function as otherwise it is exactly the example shown in class!</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="a-brief-history-of-javascript">A Brief History of JavaScript</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="start-of-1995">Start of 1995</h2>
<p>The web was HTML and images. Once a page loaded, it couldn't do anything on its own.</p>
<p>So how did a page ever change, like after the user clicked &quot;Log in&quot;?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="server-side-rendering">Server-Side Rendering</h2>
<p><img src="examples/diagrams/server-side-rendering-overview.svg" alt="The browser asked the server for a page. The server built the HTML and sent back a whole new page." style="width:1100px;" /></p>
<p>Every time a page needed to change, the server built a whole new page. Building the HTML on the server is called <strong>server-side rendering</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="example-logging-in">Example: Logging In</h2>
<p><img src="examples/diagrams/server-side-rendering.svg" alt="The user clicked &quot;Log in&quot; and the browser sent the form to the server. The server saw the empty password and built new HTML. The browser loaded the whole new page, which said &quot;Login failed, please enter a password&quot;." style="width:1100px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problems-with-server-side-rendering">Problems with Server-Side Rendering</h2>
<ol>
<li>Incredibly slow: especially back in the '90s and before</li>
<li>Annoying: setting up server-side rendering for simple things like a drop-down menu is ridiculous</li>
<li>Small checks: the browser could not check an empty password box. It had to send the form to the server.</li>
</ol>
<p>If the browser could run code, the page could check the password box itself and show the message right away, without asking the server.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="1995-things-change">1995: Things Change</h2>
<ul>
<li>Sun: <strong>Java applets</strong>, allowed Java programs to run inside the page through a plugin the user had to install</li>
<li>Netscape: <strong>JavaScript</strong>, a scripting language built into the browser, no plugin needed</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="java-applets">Java Applets</h2>
<center>
<p><a href="https://youtu.be/ZqGSg4b_cZA?t=302"><img src="https://img.youtube.com/vi/ZqGSg4b_cZA/hqdefault.jpg" alt="Java Applets video" /></a></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="why-did-applets-eventually-die-out">Why Did Applets Eventually Die Out?</h2>
<ul>
<li>Slow</li>
<li>Security risks</li>
<li>Compatibility problems from the <a href="https://en.wikipedia.org/wiki/Browser_wars">browser wars</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="javascript">JavaScript</h2>
<ul>
<li>Brendan Eich wrote the first version of <em>JavaScript</em> at Netscape in May 1995. He had ten days.</li>
<li>It was first called <em>Mocha</em>.</li>
<li>Then it was renamed to <em>LiveScript</em>.</li>
<li>Then in December 1995, Netscape and Sun renamed it JavaScript.</li>
<li>Despite the name, JavaScript and Java are different languages.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="main-features">Main Features</h2>
<ul>
<li><strong>Dynamically typed</strong>: a variable can hold any kind of value, and can switch types.</li>
<li><strong>Interpreted</strong>: the browser reads our code and runs it as is, with no extra build step.</li>
<li><strong>Runs in the browser</strong>: it can read and change the page while it's open (the DOM).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="example-logging-in-with-javascript">Example: Logging In with JavaScript</h2>
<p><img src="examples/diagrams/javascript-in-the-browser.svg" alt="The user clicked &quot;Log in&quot; and the page's JavaScript ran. JavaScript saw the empty password box. JavaScript added &quot;Login failed, please enter a password&quot; to the same page, and the page did not reload. All three steps happened inside the user's browser." style="width:1000px;" /></p>
<p>No server roundtrip required anymore.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="nodejs">Node.js</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="javascript-only-ran-in-the-browser">JavaScript Only Ran in the Browser</h2>
<p>JavaScript was built to run inside a browser, and there was no easy way to run it anywhere else. The server, the computer sending out the pages, ran programs in other languages.</p>
<p>What if we wanted to write the server in JavaScript too?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="nodejs-1">Node.js</h2>
<p>Ryan Dahl released <strong>Node.js</strong> in 2009. It takes the part of Chrome that runs JavaScript and runs it outside the browser (<a href="https://nodejs.org/en/learn/getting-started/introduction-to-nodejs">nodejs.org</a>).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">node script.js
</code></pre>
<p>Now one language can run on both the browser and the server.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="live-demo">Live Demo</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ node
&gt; console.log(<span class="hljs-string">&quot;hello from the REPL&quot;</span>)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">$ node hello.js
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="well-use-the-browser">We'll Use the Browser</h2>
<p>We don't need to install Node.js for today. Every browser already has a <strong>console</strong>, where we can run JavaScript and see what it prints.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="the-browser-console">The Browser Console</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="opening-the-console">Opening the Console</h2>
<table>
<thead>
<tr>
<th>Browser</th>
<th>Windows</th>
<th>Mac</th>
</tr>
</thead>
<tbody>
<tr>
<td>Chrome / Edge</td>
<td><code>Ctrl</code> + <code>Shift</code> + <code>J</code></td>
<td><code>Cmd</code> + <code>Option</code> + <code>J</code></td>
</tr>
<tr>
<td>Firefox</td>
<td><code>Ctrl</code> + <code>Shift</code> + <code>K</code></td>
<td><code>Cmd</code> + <code>Option</code> + <code>K</code></td>
</tr>
<tr>
<td>Safari</td>
<td></td>
<td><code>Cmd</code> + <code>Option</code> + <code>C</code></td>
</tr>
</tbody>
</table>
<p>Safari needs <strong>Settings → Advanced → Show features for web developers</strong> turned on first. In any browser, we can also right-click the page, pick <strong>Inspect</strong>, then click the <strong>Console</strong> tab.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="our-first-line">Our First Line</h2>
<p>Type this into the console and press Enter:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, World!&quot;</span>);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, World!
</code></pre>
<p><code>console.log()</code> prints whatever is inside the parentheses.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="we-can-use-the-console-like-a-calculator">We Can Use the Console like a Calculator</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js">&gt; <span class="hljs-number">2</span> + <span class="hljs-number">3</span>  <span class="hljs-comment">// our input</span>
&lt; <span class="hljs-number">5</span>      <span class="hljs-comment">// the console&#x27;s output</span>
&gt; <span class="hljs-number">10</span> * <span class="hljs-number">4</span>
&lt; <span class="hljs-number">40</span>
&gt; <span class="hljs-number">3</span> ** <span class="hljs-number">2</span> <span class="hljs-comment">// this is 3², so `**` means &quot;to the power of&quot;</span>
&lt; <span class="hljs-number">9</span>
</code></pre>
<p>When we type an expression (e.g. <code>3 + 5</code>) it shows the return value (e.g. <code>8</code>).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="when-there-is-no-return-value">When There is No Return Value</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">&gt; console.log(&quot;Hi&quot;)
  Hi
&lt; undefined
</code></pre>
<ul>
<li>The console runs our line, and it shows that line's value.</li>
<li><code>console.log</code> printed <code>Hi</code>, but <code>console.log(...)</code> itself has no value, so the console showed <code>undefined</code>.</li>
<li>When we get to functions, we'll see how to use this behavior intentionally.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="running-javascript">Running JavaScript</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="running-code-in-a-page">Running Code in a Page</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>JavaScript Starter<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, Bentley!&quot;</span>);
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, Bentley!
</code></pre>
<p>The easiest way to write JavaScript that other browsers run is by using the <code>&lt;script&gt;</code> tag. We place <code>&lt;script&gt;</code> at the end of the <code>&lt;body&gt;</code>. When we reload the page, the code inside <code>&lt;script&gt;</code> will re-run.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="note-the-console-versus-a-script">Note: The Console Versus a Script</h2>
<p>If you write this:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-string">&quot;Colan&quot;</span>;
  <span class="hljs-number">365</span> * <span class="hljs-number">24</span>;
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<p>Nothing prints. The console shows a line's value only when you type that line into the console. In a script, only <code>console.log</code> prints.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="statements-and-data-types">Statements and Data Types</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="statements">Statements</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;first&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;second&quot;</span>);
</code></pre>
<p>Each line is a <strong>statement</strong>: one instruction. The browser runs them from top to bottom, and each one ends with a <code>;</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="do-we-need-the">Do We Need the <code>;</code>?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;first&quot;</span>)
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;second&quot;</span>)
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<p>If you run the above, it will work as well. Without a <code>;</code>, JavaScript guesses where each statement ends. When it guesses wrong, the code breaks in confusing ways, so use <code>;</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="comments">Comments</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// A comment runs to the end of the line</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hi&quot;</span>); <span class="hljs-comment">// it can go after code, too</span>

<span class="hljs-comment">/* A comment can also
   span several lines */</span>
</code></pre>
<p>The browser skips comments. HTML has <code>&lt;!-- --&gt;</code>, CSS has <code>/* */</code>, and JavaScript has both <code>//</code> and <code>/* */</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="variables">Variables</h2>
<p>A <strong>variable</strong> is a name for a value, so we can use the value later.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> a;          <span class="hljs-comment">// make a variable named a</span>
a = <span class="hljs-literal">true</span>;       <span class="hljs-comment">// put a value in it</span>

<span class="hljs-keyword">let</span> b = <span class="hljs-number">1</span>;      <span class="hljs-comment">// both at once</span>

<span class="hljs-keyword">const</span> c = <span class="hljs-string">&quot;Hi&quot;</span>; <span class="hljs-comment">// a variable that can&#x27;t change</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="lets-write-a-program">Let's Write a Program</h2>
<p>Download <a href="examples/inline-js-starter.html">index.html</a> and set it up in WebStorm</p>
<ul>
<li>Open the page.</li>
<li>View Source.</li>
<li>Copy and paste into new html file on WebStorm.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-me-3--2">Problem (Me): 3 + 2</h2>
<ul>
<li>Make a variable <code>result</code> and calculate three plus two.</li>
<li>Log <code>result</code> to the console.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-3--2">Solution (Me): 3 + 2</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> result = <span class="hljs-number">3</span> + <span class="hljs-number">2</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(result);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">5
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-us-subtracting-from-a-variable">Problem (Us): Subtracting from a Variable</h2>
<p>Let's write a program that subtracts 3 from a variable.</p>
<ol>
<li>Make a variable named <code>number</code> that holds a number.</li>
<li>Store <code>number</code> minus 3 in <code>result</code>.</li>
<li>Print <code>result</code>.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-us-subtracting-from-a-variable-continued">Solution (Us): Subtracting from a Variable (Continued)</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> number = <span class="hljs-number">10</span>;         <span class="hljs-comment">// 1</span>
<span class="hljs-keyword">let</span> result = number - <span class="hljs-number">3</span>; <span class="hljs-comment">// 2</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(result);     <span class="hljs-comment">// 3</span>
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">7
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/subtracting-from-a-variable.svg" alt="Step 1 stored 10 in a box named number. In step 2, JavaScript read 10 from number, so number - 3 became 10 - 3, which is 7. JavaScript stored 7 in a box named result. Step 3 printed 7 in the console." style="width:530px;" /></p>
</div>
</div>
<p>If we change <code>number</code> to <code>20</code>, the program prints <code>17</code>. Same thing if we do <code>15</code> for <code>12</code> or <code>9</code> for <code>6</code>, etc.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-you-adding-two-variables">Problem (You): Adding Two Variables</h2>
<ol>
<li>Make two variables that each hold a number.</li>
<li>Add them together and store the answer in <code>sum</code>.</li>
<li>Print <code>sum</code>.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-you-adding-two-variables">Solution (You): Adding Two Variables</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> first = <span class="hljs-number">4</span>;
<span class="hljs-keyword">let</span> second = <span class="hljs-number">7</span>;
<span class="hljs-keyword">let</span> sum = first + second;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(sum);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">11
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="let-changing-a-value"><code>let</code>: Changing a Value</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> price = <span class="hljs-number">14.5</span>;   <span class="hljs-comment">// 1</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(price); <span class="hljs-comment">// 2</span>

price = <span class="hljs-number">16</span>;         <span class="hljs-comment">// 3</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(price); <span class="hljs-comment">// 4</span>
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">14.5
16
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/changing-a-value.svg" alt="Step 1 stored 14.5 in a box named price. Step 2 printed 14.5 in the console. Step 3 stored 16 in price, and 16 replaced 14.5. Step 4 printed 16, so the console showed 14.5 and then 16." style="width:530px;" /></p>
</div>
</div>
<p>With <code>let</code>, we can give the variable a new value.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="const"><code>const</code></h2>
<p>If we want a variable that can't change, we can use <code>const</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">TAX_RATE</span> = <span class="hljs-number">0.0625</span>;
</code></pre>
<p>Try to change the value of <code>TAX_RATE</code>. What happens? (Open up your console and see for yourselves.)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="changing-a-const">Changing a <code>const</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Uncaught TypeError: Assignment to constant variable.
</code></pre>
<ul>
<li>You can't change a <code>const</code>.</li>
<li>Also, note the name <code>TAX_RATE</code>. This style (all caps with an underscore between words) makes it easy for other developers to know when they are interacting with a <code>const</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="brief-aside-var">Brief Aside: <code>var</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">var</span> price = <span class="hljs-number">14.5</span>;
</code></pre>
<p><code>var</code> is the older way to make a variable, from before <code>let</code> and <code>const</code> arrived in 2015. Older examples online use it. We'll use <code>let</code> and <code>const</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="naming-variables-the-rules">Naming Variables: The Rules</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> price = <span class="hljs-number">12</span>;        <span class="hljs-comment">// works</span>
<span class="hljs-keyword">let</span> _price = <span class="hljs-number">12</span>;       <span class="hljs-comment">// works </span>
<span class="hljs-keyword">let</span> 2price = <span class="hljs-number">12</span>;       <span class="hljs-comment">// error: a name must start with a letter</span>
<span class="hljs-keyword">let</span> <span class="hljs-keyword">const</span> = <span class="hljs-number">12</span>;        <span class="hljs-comment">// error: JavaScript already uses const</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="naming-variables-camel-case">Naming Variables: Camel Case</h2>
<p>A name can't have spaces. When a name has more than one word, we use <strong>camel case</strong>.</p>
<p><img src="examples/diagrams/camel-case.svg" alt="Step 1 wrote the name as the words number, of, shares, and held, with spaces between them. Step 2 removed the spaces, which gave numberofsharesheld. Step 3 capitalized each word after the first, which gave numberOfSharesHeld." style="width:960px;" /></p>
<p>&quot;current state&quot; becomes <code>currentState</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-me-naming-a-variable">Problem (Me): Naming a Variable</h2>
<p>We need a variable for the number of students in this class. What should we name it?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-naming-a-variable">Solution (Me): Naming a Variable</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> x = <span class="hljs-number">30</span>;                  <span class="hljs-comment">// works, but what is x?</span>
<span class="hljs-keyword">let</span> number <span class="hljs-keyword">of</span> students = <span class="hljs-number">30</span>; <span class="hljs-comment">// error: no spaces allowed</span>
<span class="hljs-keyword">let</span> numberofstudents = <span class="hljs-number">30</span>;   <span class="hljs-comment">// works, but hard to read</span>
<span class="hljs-keyword">let</span> numberOfStudents = <span class="hljs-number">30</span>;   <span class="hljs-comment">// works, but maybe too verbose</span>
<span class="hljs-keyword">let</span> studentCount = <span class="hljs-number">30</span>;       <span class="hljs-comment">// camelCase and simple</span>
</code></pre>
<p>A good name tells us what the value is, so we don't have to read the rest of the code to find out.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-us-minutes-in-a-day">Problem (Us): Minutes in a Day</h2>
<p>Let's make a variable for the number of minutes in a day.</p>
<ol>
<li>Pick a name for the variable.</li>
<li>Store <code>24 * 60</code> in it.</li>
<li>Print it.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-us-minutes-in-a-day">Solution (Us): Minutes in a Day</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> minutesPerDay = <span class="hljs-number">24</span> * <span class="hljs-number">60</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(minutesPerDay);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1440
</code></pre>
<p><code>minutes</code> alone would leave out the &quot;per day&quot; part.</p>
<blockquote>
<p><strong>Note:</strong> The minutes in a day never change, so this should probably be a <code>const</code>, named in all capitals like <code>TAX_RATE</code>: <code>const MINUTES_PER_DAY = 24 * 60;</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-you-buying-coffee">Problem (You): Buying Coffee</h2>
<p>A customer bought 3 bags of coffee at $14.50 a bag.</p>
<ol>
<li>Make a variable for the price of one bag.</li>
<li>Make a variable for the number of bags they bought.</li>
<li>Make a variable for the total, then print it.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-you-buying-coffee">Solution (You): Buying Coffee</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> bagPrice = <span class="hljs-number">14.5</span>;
<span class="hljs-keyword">let</span> bagsBought = <span class="hljs-number">3</span>;
<span class="hljs-keyword">let</span> total = bagPrice * bagsBought;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(total);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">43.5
</code></pre>
<p>Other names work too, like <code>pricePerBag</code> or <code>bagCount</code>. Each name should tell a reader what the variable holds.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="data-types">Data Types</h2>
<center>
<table>
<thead>
<tr>
<th>Type</th>
<th>Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td>number</td>
<td><code>25</code>, <code>80.5</code>, <code>-3</code></td>
</tr>
<tr>
<td>string (text)</td>
<td><code>&quot;Hi&quot;</code>, <code>'Hi'</code></td>
</tr>
<tr>
<td>boolean</td>
<td><code>true</code>, <code>false</code></td>
</tr>
<tr>
<td>undefined</td>
<td>a variable we never gave a value</td>
</tr>
<tr>
<td>null</td>
<td>&quot;no value,&quot; on purpose</td>
</tr>
<tr>
<td>array (a list)</td>
<td><code>[1, 2, 3]</code></td>
</tr>
<tr>
<td>object</td>
<td><code>{ model: &quot;Golf&quot;, doors: 4 }</code></td>
</tr>
</tbody>
</table>
</center>
<p>We'll cover each of these in more detail as they become relevant.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="displaying-output-formatted-strings">Displaying Output: Formatted Strings</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="asking-the-user-with-prompt">Asking the User with <code>prompt()</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> name = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your name?&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(name);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Colan
</code></pre>
<ol>
<li><code>prompt()</code> opened a box with our question.</li>
<li>The user typed their name and clicked OK.</li>
<li><code>prompt</code> gave back what they typed as a string, and we stored that result in <code>name</code>.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="concatenation">Concatenation</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> name = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your name?&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, &quot;</span> + name + <span class="hljs-string">&quot;!&quot;</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, Colan!
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/concatenation.svg" alt="Step 1 had three pieces joined by plus signs: the string &quot;Hello, &quot; with a space at the end, the variable name, and the string &quot;!&quot;. In step 2, JavaScript read &quot;Colan&quot; from name. In step 3, plus glued the pieces together in order, which gave &quot;Hello, Colan!&quot;." style="width:530px;" /></p>
</div>
</div>
<p><code>+</code> glued the strings together. This is called <strong>concatenation</strong>. <code>+</code> doesn't add spaces, so the space after <code>Hello,</code> is inside the quotes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="template-literals">Template Literals</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> name = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your name?&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Hello, <span class="hljs-subst">${name}</span>!`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, Colan!
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/template-literal.svg" alt="Step 1 had one template literal, Hello, ${name}! in backticks, with a space after the comma. In step 2, ${name} dropped in &quot;Colan&quot;, the value of name, which gave &quot;Hello, Colan!&quot;. The space stayed where it was typed." style="width:530px;" /></p>
</div>
</div>
<p>A string in backticks (&quot;`&quot; above tab on the keyboard) is a <strong>template literal</strong>. Inside it, <code>${ }</code>drops in a value. We didn't need <code>+</code>, and the spaces stayed where we typed them.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="where-is-the-backtick">Where Is the Backtick?</h2>
<p>The backtick <code>`</code> is on the key to the left of <code>1</code>, under <code>Esc</code>. It shares that key with <code>~</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-me-full-name">Problem (Me): Full Name</h2>
<p>Say that we want to greet the user by their full name:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, Colan Biemer!
</code></pre>
<ol>
<li>Ask for the user's first name, then their last name. (We could also ask for their name all at once, but let's do them individually.)</li>
<li>Print the greeting with concatenation.</li>
<li>Print it again with a template literal.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-full-name">Solution (Me): Full Name</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> firstName = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your first name?&quot;</span>);
<span class="hljs-keyword">let</span> lastName = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your last name?&quot;</span>);

<span class="hljs-comment">// concatenation</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, &quot;</span> + firstName + <span class="hljs-string">&quot; &quot;</span> + lastName + <span class="hljs-string">&quot;!&quot;</span>);

<span class="hljs-comment">// template literal</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Hello, <span class="hljs-subst">${firstName}</span> <span class="hljs-subst">${lastName}</span>!`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, Colan Biemer!
Hello, Colan Biemer!
</code></pre>
<p>Both lines printed the same thing. With concatenation, we needed <code>&quot; &quot;</code> for the space between the two names.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-us-a-drink-order">Problem (Us): A Drink Order</h2>
<p>We want a program that takes three inputs: the user's name, the size of the drink they want, and the name of the drink they want. Then, it should print out that result twice, once with concatenation and once with templates. For example, if I enter &quot;Colan&quot;, &quot;large&quot;, and &quot;latte&quot;, then we should see in the console:</p>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Colan ordered a large latte.
Colan ordered a large latte.
</code></pre>
<p>But, instead, of coding let's try it a different way...</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-us-a-drink-order-continued">Problem (Us): A Drink Order (Continued)</h2>
<p>Unscramble the program below (Two of the lines are wrong):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${name}</span> ordered a <span class="hljs-subst">${size}</span> <span class="hljs-subst">${drink}</span>.`</span>);

<span class="hljs-keyword">let</span> size = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What size?&quot;</span>);

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(name + <span class="hljs-string">&quot; ordered a &quot;</span> + size + drink + <span class="hljs-string">&quot;.&quot;</span>);

<span class="hljs-keyword">let</span> name = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your name?&quot;</span>);

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;${name} ordered a ${size} ${drink}.&quot;</span>);

<span class="hljs-keyword">let</span> drink = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What drink?&quot;</span>);

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(name + <span class="hljs-string">&quot; ordered a &quot;</span> + size + <span class="hljs-string">&quot; &quot;</span> + drink + <span class="hljs-string">&quot;.&quot;</span>);
</code></pre>
<p>(Again, prompt for name, then size, and then, finally, for the name of the drink.)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-us-a-drink-order">Solution (Us): A Drink Order</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> name = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What&#x27;s your name?&quot;</span>);
<span class="hljs-keyword">let</span> size = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What size?&quot;</span>);
<span class="hljs-keyword">let</span> drink = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;What drink?&quot;</span>);

<span class="hljs-comment">// concatenation</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(name + <span class="hljs-string">&quot; ordered a &quot;</span> + size + <span class="hljs-string">&quot; &quot;</span> + drink + <span class="hljs-string">&quot;.&quot;</span>);
<span class="hljs-comment">// template literal</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${name}</span> ordered a <span class="hljs-subst">${size}</span> <span class="hljs-subst">${drink}</span>.`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Colan ordered a large latte.
Colan ordered a large latte.
</code></pre>
<p>One wrong line left out the <code>&quot; &quot;</code>, so it printed <code>largelatte</code>. The other used <code>&quot;</code> instead of backticks, so it printed <code>${name}</code> as plain text.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-you-fill-in-the-blanks">Problem (You): Fill in the Blanks</h2>
<p>Ask the user for words, then print a sentence like this one:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">The sleepy cat jumped over the moon.
</code></pre>
<ol>
<li>Ask for an adjective, an animal, and a verb in the past tense.</li>
<li>Print the sentence with concatenation.</li>
<li>Print it again with a template literal.</li>
</ol>
<blockquote>
<p>The [adjective] [animal] [verb] over the moon.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-you-fill-in-the-blanks">Solution (You): Fill in the Blanks</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> adjective = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Give me an adjective.&quot;</span>);
<span class="hljs-keyword">let</span> animal = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Give me an animal.&quot;</span>);
<span class="hljs-keyword">let</span> verb = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Give me a verb in the past tense.&quot;</span>);

<span class="hljs-comment">// concatenation</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;The &quot;</span> + adjective + <span class="hljs-string">&quot; &quot;</span> + animal + <span class="hljs-string">&quot; &quot;</span> + verb + <span class="hljs-string">&quot; over the moon.&quot;</span>);
<span class="hljs-comment">// template literal</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`The <span class="hljs-subst">${adjective}</span> <span class="hljs-subst">${animal}</span> <span class="hljs-subst">${verb}</span> over the moon.`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">The sleepy cat jumped over the moon.
The sleepy cat jumped over the moon.
</code></pre>
<p>Concatenation needed a <code>&quot; &quot;</code> between each pair of words. Leaving one out glued the words together, like <code>sleepycat</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="operators">Operators</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="prompt-gives-back-a-string"><code>prompt</code> Gives Back a String</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> a = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;First number?&quot;</span>);    <span class="hljs-comment">// the user typed 4</span>
<span class="hljs-keyword">let</span> b = <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Second number?&quot;</span>);   <span class="hljs-comment">// the user typed 3</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a + b);                 <span class="hljs-comment">// &quot;43&quot; -&gt; a string, not a number</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title class_">Number</span>(a) + <span class="hljs-title class_">Number</span>(b)); <span class="hljs-comment">// 7</span>
</code></pre>
<p><img src="examples/diagrams/prompt-gives-a-string.svg" alt="In step 1, a + b became &quot;4&quot; + &quot;3&quot;. Both were strings, so + glued them into &quot;43&quot;. In step 2, Number(a) + Number(b) became Number(&quot;4&quot;) + Number(&quot;3&quot;). Number turned each string into a number, so 4 + 3 added up to 7." style="width:960px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="number-parseint-parsefloat"><code>Number</code>, <code>parseInt</code>, <code>parseFloat</code></h2>
<table>
<thead>
<tr>
<th>Text</th>
<th><code>Number()</code></th>
<th><code>parseInt()</code></th>
<th><code>parseFloat()</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>&quot;10.75&quot;</code></td>
<td><code>10.75</code></td>
<td><code>10</code></td>
<td><code>10.75</code></td>
</tr>
<tr>
<td><code>&quot;12 bags&quot;</code></td>
<td><code>NaN</code></td>
<td><code>12</code></td>
<td><code>12</code></td>
</tr>
<tr>
<td><code>&quot;abc&quot;</code></td>
<td><code>NaN</code></td>
<td><code>NaN</code></td>
<td><code>NaN</code></td>
</tr>
</tbody>
</table>
<ul>
<li><code>Number</code> needs the whole string to be a number. <code>parseInt</code> keeps the whole number at the start and drops the rest. <code>parseFloat</code> does the same, but keeps decimals.</li>
<li><code>NaN</code> stands for &quot;Not a Number&quot; (e.g. <code>Number(&quot;asdf&quot;) -&gt; NaN</code>).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="cancel-and-typos">Cancel and Typos</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> bags = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How many bags?&quot;</span>));
</code></pre>
<table>
<thead>
<tr>
<th>The user...</th>
<th><code>prompt</code> gives</th>
<th><code>Number()</code> gives</th>
</tr>
</thead>
<tbody>
<tr>
<td>types <code>3</code></td>
<td><code>&quot;3&quot;</code></td>
<td><code>3</code></td>
</tr>
<tr>
<td>types <code>abc</code></td>
<td><code>&quot;abc&quot;</code></td>
<td><code>NaN</code></td>
</tr>
<tr>
<td>clicks OK with nothing typed</td>
<td><code>&quot;&quot;</code></td>
<td><code>0</code></td>
</tr>
<tr>
<td>clicks Cancel</td>
<td><code>null</code></td>
<td><code>0</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="arithmetic-operators">Arithmetic Operators</h2>
<p>An <strong>operator</strong> takes values, called <strong>operands</strong>, and gives back a new value. In <code>3 + 4</code>, <code>+</code> is the operator.</p>
<table>
<thead>
<tr>
<th>Operator</th>
<th>Meaning</th>
<th><code>10</code> and <code>4</code> give</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>+</code></td>
<td>add</td>
<td><code>14</code></td>
</tr>
<tr>
<td><code>-</code></td>
<td>subtract</td>
<td><code>6</code></td>
</tr>
<tr>
<td><code>*</code></td>
<td>multiply</td>
<td><code>40</code></td>
</tr>
<tr>
<td><code>/</code></td>
<td>divide</td>
<td><code>2.5</code></td>
</tr>
<tr>
<td><code>%</code></td>
<td>remainder</td>
<td><code>2</code></td>
</tr>
<tr>
<td><code>**</code></td>
<td>power</td>
<td><code>10000</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="remainder">Remainder: <code>%</code></h2>
<p>We split 17 cookies evenly among 5 people. Everyone got 3, and some were left over.</p>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-number">17</span> % <span class="hljs-number">5</span>);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">2
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/remainder-cookies.svg" alt="Step 1 gave 3 cookies to each of 5 people, which used 15 of the 17 cookies. In step 2, 2 cookies were left over. 17 % 5 gave that leftover count, 2." style="width:530px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="order-of-operations">Order of Operations</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-number">2</span> + <span class="hljs-number">3</span> * <span class="hljs-number">4</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>((<span class="hljs-number">2</span> + <span class="hljs-number">3</span>) * <span class="hljs-number">4</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">14
20
</code></pre>
</div>
<div>
<ol>
<li>Parentheses <code>( )</code></li>
<li><code>**</code></li>
<li><code>*</code>, <code>/</code>, and <code>%</code>, left to right</li>
<li><code>+</code> and <code>-</code>, left to right</li>
</ol>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="strings-and-numbers">Strings and Numbers</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;5&quot;</span> + <span class="hljs-number">3</span>);     <span class="hljs-comment">// 53</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;5&quot;</span> - <span class="hljs-number">3</span>);     <span class="hljs-comment">// 2</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;5&quot;</span> * <span class="hljs-number">3</span>);     <span class="hljs-comment">// 15</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-number">5</span> + <span class="hljs-number">3</span> + <span class="hljs-string">&quot;5&quot;</span>); <span class="hljs-comment">// 85</span>
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/left-to-right.svg" alt="Step 1 had 5 + 3 + &quot;5&quot;. JavaScript went left to right, so 5 + 3 ran first. In step 2, 5 and 3 were both numbers, so + added them, which gave 8 + &quot;5&quot;. In step 3, &quot;5&quot; was a string, so + glued 8 and &quot;5&quot; together, which gave &quot;85&quot;." style="width:530px;" /></p>
</div>
</div>
<p>If either side of <code>+</code> is a string, <code>+</code> glues. <code>-</code>, <code>*</code>, and <code>/</code> only do math, so they turn <code>&quot;5&quot;</code> into <code>5</code>. JavaScript goes left to right: <code>5 + 3</code> is <code>8</code>, then <code>8 + &quot;5&quot;</code> is <code>&quot;85&quot;</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="implicit-vs-explicit-conversion">Implicit vs. Explicit Conversion</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;5&quot;</span> + <span class="hljs-number">3</span>);         <span class="hljs-comment">// 53, implicit</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;5&quot;</span> + <span class="hljs-title class_">String</span>(<span class="hljs-number">3</span>)); <span class="hljs-comment">// 53, explicit</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;5&quot;</span> - <span class="hljs-number">3</span>);         <span class="hljs-comment">// 2, implicit</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title class_">Number</span>(<span class="hljs-string">&quot;5&quot;</span>) - <span class="hljs-number">3</span>); <span class="hljs-comment">// 2, explicit</span>
</code></pre>
<p>When JavaScript changes a type on its own, that's <strong>implicit conversion</strong>, and it makes code hard to read. By making the change in our code, the change is <strong>explicit</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="assignment-shortcuts">Assignment Shortcuts</h2>
<center>
<table>
<thead>
<tr>
<th>Shortcut</th>
<th>Same as</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>x += 5</code></td>
<td><code>x = x + 5</code></td>
</tr>
<tr>
<td><code>x -= 5</code></td>
<td><code>x = x - 5</code></td>
</tr>
<tr>
<td><code>x *= 5</code></td>
<td><code>x = x * 5</code></td>
</tr>
<tr>
<td><code>x /= 5</code></td>
<td><code>x = x / 5</code></td>
</tr>
<tr>
<td><code>x++</code></td>
<td><code>x = x + 1</code></td>
</tr>
<tr>
<td><code>x--</code></td>
<td><code>x = x - 1</code></td>
</tr>
</tbody>
</table>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="example-counting-cups">Example: Counting Cups</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> cupsSold = <span class="hljs-number">0</span>;      <span class="hljs-comment">// 1</span>
cupsSold++;            <span class="hljs-comment">// 2</span>
cupsSold++;            <span class="hljs-comment">// 3</span>
cupsSold += <span class="hljs-number">10</span>;        <span class="hljs-comment">// 4</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(cupsSold); <span class="hljs-comment">// 5</span>
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">12
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/counting-cups.svg" alt="Step 1 stored 0 in a box named cupsSold. Step 2 added 1, so cupsSold held 1. Step 3 added 1, so cupsSold held 2. Step 4 added 10, so cupsSold held 12. Each new value replaced the old one. Step 5 printed 12 in the console." style="width:530px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="rounding-output">Rounding Output</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> total = <span class="hljs-number">3</span> * <span class="hljs-number">14.5</span> * <span class="hljs-number">1.0625</span>; <span class="hljs-comment">// with 6.25% tax</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: <span class="hljs-subst">${total}</span>`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: $<span class="hljs-subst">${total.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Total: 46.21875
Total: $46.22
</code></pre>
<ol>
<li>We can put expressions, such as math, inside a <code>${ }</code>.</li>
<li><code>toFixed(2)</code> rounds a number to two decimal places and returns a string.</li>
<li>Notice that we needed two dollar signs (<code>$</code>) inside a template string.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-me-bags-of-coffee">Problem (Me): Bags of Coffee</h2>
<p>Let's say that a bag of coffee costs $14.50, and every order comes with one free bag. The user bought 3 bags, so the console should show:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">You get 4 bags for $43.50.
</code></pre>
<ol>
<li>Ask the user how many bags they want.</li>
<li>Add the free bag.</li>
<li>Print the bags and the price.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-bags-of-coffee">Solution (Me): Bags of Coffee</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">BAG_PRICE</span> = <span class="hljs-number">14.5</span>;

<span class="hljs-keyword">let</span> bags = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How many bags?&quot;</span>));
<span class="hljs-keyword">let</span> totalBags = bags + <span class="hljs-number">1</span>;
<span class="hljs-keyword">let</span> subtotal = bags * <span class="hljs-variable constant_">BAG_PRICE</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`You get <span class="hljs-subst">${totalBags}</span> bags for $<span class="hljs-subst">${subtotal.toFixed(<span class="hljs-number">2</span>)}</span>.`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">You get 4 bags for $43.50.
</code></pre>
<p><code>Number()</code> turned the user's input from <code>prompt</code> into <code>3</code> before any math, so <code>+</code> added.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="81" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-us-a-receipt">Problem (Us): A Receipt</h2>
<p>Let's add 6.25% sales tax and print a receipt. For 3 bags, it should look like this:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Bags: 4
Subtotal: $43.50
Tax: $2.72
Total: $46.22
</code></pre>
<ol>
<li>Store the tax rate in a <code>const</code>.</li>
<li>Work out the total with tax, then the tax by itself.</li>
<li>Print each line of the receipt with a template literal.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="82" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-us-a-receipt">Solution (Us): A Receipt</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-comment">// the math from Bags of Coffee</span>
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">TAX_RATE</span> = <span class="hljs-number">0.0625</span>;
<span class="hljs-keyword">let</span> total = subtotal * (<span class="hljs-number">1</span> + <span class="hljs-variable constant_">TAX_RATE</span>);
<span class="hljs-keyword">let</span> tax = total - subtotal;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Bags: <span class="hljs-subst">${totalBags}</span>`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Subtotal: $<span class="hljs-subst">${subtotal.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Tax: $<span class="hljs-subst">${tax.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: $<span class="hljs-subst">${total.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);
</code></pre>
</div>
<div>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Bags: 4
Subtotal: $43.50
Tax: $2.72
Total: $46.22
</code></pre>
</div>
</div>
<p>Without the parentheses, <code>subtotal * 1 + TAX_RATE</code> would have been <code>43.5625</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="83" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-you-movie-marathon">Problem (You): Movie Marathon</h2>
<p>The user watched three movies that were 120, 95, and 130 minutes long. The program should print:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">The marathon is 5 hours and 45 minutes.
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> hours = (total - minutes) / <span class="hljs-number">60</span>;
total += <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 2 length in minutes?&quot;</span>));
<span class="hljs-keyword">let</span> hours = total - minutes / <span class="hljs-number">60</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`The marathon is <span class="hljs-subst">${hours}</span> hours and <span class="hljs-subst">${minutes}</span> minutes.`</span>);
<span class="hljs-keyword">let</span> total = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 1 length in minutes?&quot;</span>));
total += <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 3 length in minutes?&quot;</span>);
total += <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 3 length in minutes?&quot;</span>));
<span class="hljs-keyword">let</span> minutes = total % <span class="hljs-number">60</span>;
</code></pre>
<p>Assemble the program from the lines above. Note, though, that two of the lines are wrong.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="84" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-you-movie-marathon">Solution (You): Movie Marathon</h2>
