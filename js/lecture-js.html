<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> total = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 1 length in minutes?&quot;</span>));
total += <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 2 length in minutes?&quot;</span>));
total += <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Movie 3 length in minutes?&quot;</span>));

<span class="hljs-keyword">let</span> minutes = total % <span class="hljs-number">60</span>;
<span class="hljs-keyword">let</span> hours = (total - minutes) / <span class="hljs-number">60</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`The marathon is <span class="hljs-subst">${hours}</span> hours and <span class="hljs-subst">${minutes}</span> minutes.`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">The marathon is 5 hours and 45 minutes.
</code></pre>
<p>Without <code>Number()</code>, <code>+=</code> glued <code>&quot;130&quot;</code> onto the end, which gave <code>&quot;215130&quot;</code>. Without the parentheses, only <code>minutes</code> was divided by 60.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="85" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-you-movie-marathon-continued">Solution (You): Movie Marathon (Continued)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> minutes = total % <span class="hljs-number">60</span>;           <span class="hljs-comment">// 1</span>
<span class="hljs-keyword">let</span> hours = (total - minutes) / <span class="hljs-number">60</span>; <span class="hljs-comment">// 2</span>
</code></pre>
<p><img src="examples/diagrams/movie-marathon.svg" alt="total held 345 minutes, which split into five blocks of 60 minutes and 45 minutes left over. In step 1, total % 60 became 345 % 60, which is 45, and JavaScript stored 45 in minutes. In step 2, (total - minutes) / 60 became (345 - 45) / 60, then 300 / 60, which is 5, and JavaScript stored 5 in hours." style="width:1000px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="86" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="functions">Functions</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="87" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="use-a-function-1">Use a Function</h2>
<p>We are about to cover how to write and use a function. You must do it in this format for the exercises this week:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">functionName</span>(<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;hi&quot;</span>);
}
</code></pre>
<p>Which is to say, use <code>function</code> to declare functions, not arrow format.</p>
<blockquote>
<p><strong>IMPORTANT:</strong> No credit will be given if this exercise does not use a function as otherwise it is exactly the example shown in class!</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="88" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-the-same-math-three-times">Problem: The Same Math Three Times</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> total = <span class="hljs-number">14.5</span> * <span class="hljs-number">1.0625</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: $<span class="hljs-subst">${total.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);

total = <span class="hljs-number">18</span> * <span class="hljs-number">1.0625</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: $<span class="hljs-subst">${total.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);

total = <span class="hljs-number">12.25</span> * <span class="hljs-number">1.0625</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: $<span class="hljs-subst">${total.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);
</code></pre>
<p>We wrote the same two lines three times. If the tax rate changes, we have to fix it in three places (like the 40 red paragraphs in CSS).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="89" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="we-can-remove-duplicate-code-with-functions">We Can Remove Duplicate Code With Functions</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">printTotal</span>(<span class="hljs-params">price</span>) {
  <span class="hljs-keyword">let</span> total = price * <span class="hljs-number">1.0625</span>;
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: $<span class="hljs-subst">${total.toFixed(<span class="hljs-number">2</span>)}</span>`</span>);
}

<span class="hljs-title function_">printTotal</span>(<span class="hljs-number">14.5</span>);
<span class="hljs-title function_">printTotal</span>(<span class="hljs-number">18</span>);
<span class="hljs-title function_">printTotal</span>(<span class="hljs-number">12.25</span>);
</code></pre>
</div>
<div>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Total: $15.41
Total: $19.13
Total: $13.02
</code></pre>
</div>
</div>
<p>A <strong>function</strong> is a grouping of code with a name.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="90" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="writing-a-function">Writing a Function</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">sayHello</span>(<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, welcome to Bentley CS 213!&quot;</span>);
}

<span class="hljs-title function_">sayHello</span>();
</code></pre>
<ul>
<li>A function starts with <code>function</code>, then a name, then <code>()</code>.</li>
<li>The code it runs goes inside <code>{ }</code>.</li>
<li><code>sayHello();</code> <strong>calls</strong> the function, which runs the statements inside it.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="91" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-nothing-prints">Problem: Nothing Prints</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  <span class="hljs-keyword">function</span> <span class="hljs-title function_">sayHello</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, welcome to Bentley CS 213!&quot;</span>);
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<p>If we open a page with the <code>&lt;script&gt;</code> above, we won't see anything print to the console.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="92" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-nothing-prints">Solution: Nothing Prints</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">sayHello</span>(<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, welcome to Bentley CS 213!&quot;</span>);
}

<span class="hljs-title function_">sayHello</span>();
<span class="hljs-title function_">sayHello</span>();
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Hello, welcome to Bentley CS 213!
Hello, welcome to Bentley CS 213!
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/calling-a-function.svg" alt="Step 1 saved the function sayHello, but did not run the code inside it. In step 2, the first sayHello() call ran the code inside. In step 3, the second sayHello() call ran it again. Each run printed the greeting, so the console showed it twice." style="width:530px;" /></p>
</div>
</div>
<p>Writing a function only defines it. Nothing inside runs until we call it. Above, <code>sayHello</code> was called twice. So, it printed twice.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="93" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="parameters-and-arguments">Parameters and Arguments</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">displaySum</span>(<span class="hljs-params">num1, num2</span>) {
  <span class="hljs-keyword">let</span> total = num1 + num2;
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Total: <span class="hljs-subst">${total}</span>`</span>);
}

<span class="hljs-title function_">displaySum</span>(<span class="hljs-number">6</span>, <span class="hljs-number">20</span>);
<span class="hljs-title function_">displaySum</span>(-<span class="hljs-number">5</span>, <span class="hljs-number">17</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Total: 26
Total: 12
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/parameters-and-arguments.svg" alt="Step 1 called displaySum(6, 20). The arguments 6 and 20 went into the parameters num1 and num2, in order. In step 2, JavaScript read 6 from num1 and 20 from num2, so num1 + num2 became 6 + 20, which is 26. JavaScript stored 26 in a box named total. Step 3 printed Total: 26 in the console." style="width:530px;" /></p>
</div>
</div>
<p><code>num1</code> and <code>num2</code> are <strong>parameters</strong>: variables that get their values when we call the function. The values we pass in, like <code>6</code> and <code>20</code>, are <strong>arguments</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="94" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-arguments-in-order">Problem: Arguments in Order</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">describeDrink</span>(<span class="hljs-params">size, drink</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`A <span class="hljs-subst">${size}</span> <span class="hljs-subst">${drink}</span>`</span>);
}

<span class="hljs-title function_">describeDrink</span>(<span class="hljs-string">&quot;large&quot;</span>, <span class="hljs-string">&quot;latte&quot;</span>);
<span class="hljs-title function_">describeDrink</span>(<span class="hljs-string">&quot;latte&quot;</span>, <span class="hljs-string">&quot;large&quot;</span>);
<span class="hljs-title function_">describeDrink</span>(<span class="hljs-string">&quot;large&quot;</span>);
</code></pre>
<p>The first call printed <code>A large latte</code>. What did the other two print?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="95" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-arguments-in-order">Solution: Arguments in Order</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">describeDrink</span>(<span class="hljs-params">size, drink</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`A <span class="hljs-subst">${size}</span> <span class="hljs-subst">${drink}</span>`</span>);
}

<span class="hljs-title function_">describeDrink</span>(<span class="hljs-string">&quot;large&quot;</span>, <span class="hljs-string">&quot;latte&quot;</span>);
<span class="hljs-title function_">describeDrink</span>(<span class="hljs-string">&quot;latte&quot;</span>, <span class="hljs-string">&quot;large&quot;</span>);
<span class="hljs-title function_">describeDrink</span>(<span class="hljs-string">&quot;large&quot;</span>);
</code></pre>
</div>
<div>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">A large latte
A latte large
A large undefined
</code></pre>
</div>
</div>
<ul>
<li>Arguments go into parameters in order. The first argument goes into <code>size</code>, and the second goes into <code>drink</code>.</li>
<li>A parameter with no argument is <code>undefined</code>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="96" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="return"><code>return</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">addTax</span>(<span class="hljs-params">price</span>) {
  <span class="hljs-keyword">return</span> price * <span class="hljs-number">1.0625</span>;
}

<span class="hljs-keyword">let</span> total = <span class="hljs-title function_">addTax</span>(<span class="hljs-number">10</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(total * <span class="hljs-number">2</span>);
</code></pre>
</div>
<div>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">21.25
</code></pre>
</div>
</div>
<p><strong><code>return</code></strong> gives a value back to the code that called the function. A function without <code>return</code> gives back <code>undefined</code>.</p>
<ol>
<li><code>addTax(10)</code> set <code>price</code> to <code>10</code>.</li>
<li><code>return</code> gave back <code>10.625</code>.</li>
<li><code>total</code> stored <code>10.625</code>, so <code>total * 2</code> was <code>21.25</code>.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="97" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="return-continued"><code>return</code> (Continued)</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">addTax</span>(<span class="hljs-params">price</span>) {
  <span class="hljs-keyword">return</span> price * <span class="hljs-number">1.0625</span>;
}

<span class="hljs-keyword">let</span> total = <span class="hljs-title function_">addTax</span>(<span class="hljs-number">10</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(total * <span class="hljs-number">2</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">21.25
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/return-a-value.svg" alt="Step 1 called addTax(10), so price held 10 inside addTax. In step 2, price * 1.0625 became 10 * 1.0625, which is 10.625, and return gave back 10.625. In step 3, JavaScript stored 10.625 in a box named total, so total * 2 became 10.625 * 2, which is 21.25. Step 4 printed 21.25 in the console." style="width:530px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="98" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="return-ends-the-function"><code>return</code> Ends the Function</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">addTax</span>(<span class="hljs-params">price</span>) {
  <span class="hljs-keyword">return</span> price * <span class="hljs-number">1.0625</span>;
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;This never runs&quot;</span>);
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">addTax</span>(<span class="hljs-number">10</span>));
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>10.625
</code></pre>
<p>Once a function reaches <code>return</code>, it stops. JavaScript skips anything after it. So, <code>&quot;This never runs&quot;</code> is never logged to the console.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="99" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="copy-by-value">Copy by Value</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">addFreeBag</span>(<span class="hljs-params">count</span>) {
  count = count + <span class="hljs-number">1</span>;
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(count);
}

<span class="hljs-keyword">let</span> bags = <span class="hljs-number">3</span>;
<span class="hljs-title function_">addFreeBag</span>(bags);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(bags);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">4
3
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/copy-by-value.svg" alt="Step 1 stored 3 in a box named bags. In step 2, addFreeBag(bags) copied 3 into a new box named count, inside addFreeBag. Step 3 added 1 to count, so count held 4. The new value replaced the copy, and bags still held 3. Step 4 printed 4 from count. Step 5 printed 3 from bags, so the console showed 4 and then 3." style="width:530px;" /></p>
</div>
</div>
<p>When we called <code>addFreeBag(bags)</code>, <code>count</code> got a copy of the value in <code>bags</code>. The function changed the copy, so <code>bags</code> stayed <code>3</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="100" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="getting-the-new-value-out">Getting the New Value Out</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">addFreeBag</span>(<span class="hljs-params">count</span>) {
  <span class="hljs-keyword">return</span> count + <span class="hljs-number">1</span>;
}

<span class="hljs-keyword">let</span> bags = <span class="hljs-number">3</span>;
bags = <span class="hljs-title function_">addFreeBag</span>(bags);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(bags);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">4
</code></pre>
</div>
<div>
<p><img src="examples/diagrams/getting-the-new-value-out.svg" alt="Step 1 stored 3 in a box named bags. In step 2, addFreeBag(bags) copied 3 into a box named count, inside addFreeBag. In step 3, count + 1 became 3 + 1, which is 4, and return gave back 4. JavaScript stored 4 in bags, and 4 replaced 3. Step 4 printed 4 in the console." style="width:530px;" /></p>
</div>
</div>
<p>To change <code>bags</code>, the function returned the new value, and we stored it back in <code>bags</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="101" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-me-converting-temperatures">Problem (Me): Converting Temperatures</h2>
<p>Let's say the user typed <code>212</code>. The console should show:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">212 Fahrenheit is 100 Celsius.
100 Celsius is 212 Fahrenheit.
</code></pre>
<ol>
<li>Write <code>toCelsius(fahrenheit)</code>. It returns (Fahrenheit − 32) × 5 / 9.</li>
<li>Write <code>toFahrenheit(celsius)</code>. It returns Celsius × 9 / 5 + 32.</li>
<li>Ask the user for a temperature in Fahrenheit, convert it to Celsius and back, and print both lines.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="102" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="102" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-the-functions">Solution (Me): The Functions</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">toCelsius</span>(<span class="hljs-params">fahrenheit</span>) {
  <span class="hljs-keyword">return</span> (fahrenheit - <span class="hljs-number">32</span>) * <span class="hljs-number">5</span> / <span class="hljs-number">9</span>;
}

<span class="hljs-keyword">function</span> <span class="hljs-title function_">toFahrenheit</span>(<span class="hljs-params">celsius</span>) {
  <span class="hljs-keyword">return</span> celsius * <span class="hljs-number">9</span> / <span class="hljs-number">5</span> + <span class="hljs-number">32</span>;
}
</code></pre>
<p><code>toCelsius</code> needed parentheses, so the subtraction happened first. <code>toFahrenheit</code> did not, because <code>*</code> and <code>/</code> already go before <code>+</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="103" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="103" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-converting-temperatures">Solution (Me): Converting Temperatures</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> fahrenheit = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;Temperature in Fahrenheit?&quot;</span>));
<span class="hljs-keyword">let</span> celsius = <span class="hljs-title function_">toCelsius</span>(fahrenheit);
<span class="hljs-keyword">let</span> backAgain = <span class="hljs-title function_">toFahrenheit</span>(celsius);

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${fahrenheit}</span> Fahrenheit is <span class="hljs-subst">${celsius}</span> Celsius.`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${celsius}</span> Celsius is <span class="hljs-subst">${backAgain}</span> Fahrenheit.`</span>);
</code></pre>
</div>
<div>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">212 Fahrenheit is 100 Celsius.
100 Celsius is 212 Fahrenheit.
</code></pre>
</div>
</div>
<p>The value <code>toCelsius</code> returned went into <code>toFahrenheit</code> as its argument. We could also write <code>toFahrenheit(toCelsius(fahrenheit))</code>. The inner call runs first.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="104" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-me-converting-temperatures-continued">Solution (Me): Converting Temperatures (Continued)</h2>
<center>
<p><img src="examples/diagrams/converting-temperatures.svg" alt="Top row: fahrenheit held 212. In step 1, toCelsius got 212, worked out (212 - 32) * 5 / 9, and returned 100, which went into celsius. In step 2, toFahrenheit got 100, worked out 100 * 9 / 5 + 32, and returned 212, which went into backAgain. Bottom row: in one line, toFahrenheit(toCelsius(fahrenheit)) became toFahrenheit(toCelsius(212)). The inner call, toCelsius, ran first and gave back 100, which gave toFahrenheit(100). The outer call ran next and gave back 212." style="width:1000px;" /></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="105" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="105" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-us-cups-of-coffee">Problem (Us): Cups of Coffee</h2>
<p>Let's say one bag of coffee makes 30 cups. The user typed <code>3</code>, and the console showed:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">3 bags make 90 cups.
</code></pre>
<ol>
<li>Store the cups per bag in a <code>const</code>.</li>
<li>Write a function <code>countCups</code> with one parameter, <code>bags</code>, that returns the number of cups.</li>
<li>Ask the user for the number of bags, then print the sentence.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="106" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-us-cups-of-coffee">Solution (Us): Cups of Coffee</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">CUPS_PER_BAG</span> = <span class="hljs-number">30</span>;

<span class="hljs-keyword">function</span> <span class="hljs-title function_">countCups</span>(<span class="hljs-params">bags</span>) {
  <span class="hljs-keyword">return</span> bags * <span class="hljs-variable constant_">CUPS_PER_BAG</span>;
}

<span class="hljs-keyword">let</span> bagsBought = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How many bags?&quot;</span>));
<span class="hljs-keyword">let</span> cups = <span class="hljs-title function_">countCups</span>(bagsBought);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${bagsBought}</span> bags make <span class="hljs-subst">${cups}</span> cups.`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">3 bags make 90 cups.
</code></pre>
<p><code>countCups(bagsBought)</code> gave <code>3</code> to <code>bags</code>. The function returned <code>90</code>, and we stored it in <code>cups</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="107" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="problem-you-cost-per-cup">Problem (You): Cost per Cup</h2>
<p>Let's say a $14.50 bag of coffee made 30 cups. The program should print:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Each cup cost $0.48.
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">let</span> cost = <span class="hljs-title function_">costPerCup</span>(cups, bagPrice);
}
<span class="hljs-keyword">let</span> bagPrice = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How much was the bag?&quot;</span>));
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Each cup cost $<span class="hljs-subst">${cost.toFixed(<span class="hljs-number">2</span>)}</span>.`</span>);
  <span class="hljs-keyword">return</span> bagPrice / cups;
<span class="hljs-keyword">function</span> <span class="hljs-title function_">costPerCup</span>(<span class="hljs-params">bagPrice, cups</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(bagPrice / cups);
<span class="hljs-keyword">let</span> cups = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How many cups did it make?&quot;</span>));
<span class="hljs-keyword">let</span> cost = <span class="hljs-title function_">costPerCup</span>(bagPrice, cups);
</code></pre>
<p>Assemble the program from the lines above. Two of the lines are wrong.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="108" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="solution-you-cost-per-cup">Solution (You): Cost per Cup</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">costPerCup</span>(<span class="hljs-params">bagPrice, cups</span>) {
  <span class="hljs-keyword">return</span> bagPrice / cups;
}

<span class="hljs-keyword">let</span> bagPrice = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How much was the bag?&quot;</span>));
<span class="hljs-keyword">let</span> cups = <span class="hljs-title class_">Number</span>(<span class="hljs-title function_">prompt</span>(<span class="hljs-string">&quot;How many cups did it make?&quot;</span>));
<span class="hljs-keyword">let</span> cost = <span class="hljs-title function_">costPerCup</span>(bagPrice, cups);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Each cup cost $<span class="hljs-subst">${cost.toFixed(<span class="hljs-number">2</span>)}</span>.`</span>);
</code></pre>
<p class="caption">Console</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Each cup cost $0.48.
</code></pre>
<p><code>costPerCup(cups, bagPrice)</code> put <code>30</code> into <code>bagPrice</code>, since arguments go in order. With <code>console.log</code> instead of <code>return</code>, <code>cost</code> was <code>undefined</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="109" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="linking-scripts">Linking Scripts</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="110" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="src-attribute"><code>src</code> Attribute</h2>
<div class="side-by-side">
<div>
<p><code>index.html</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>JavaScript Starter<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;script.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
</div>
<div>
<p><code>script.js</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, World!&quot;</span>);
</code></pre>
</div>
</div>
<p>Our programs got longer, so we moved the code into its own file. <code>src</code> tells the browser which file to run.</p>
<p>Starter files: <a href="examples/script-starter/index.html">index.html</a> and <a href="examples/script-starter/script.js">script.js</a>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="111" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="linking-a-script-vs-a-stylesheet">Linking a Script vs. a Stylesheet</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;stylesheet&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;style.css&quot;</span> /&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>JavaScript Starter<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;script.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
</code></pre>
<ul>
<li>A stylesheet uses <code>&lt;link&gt;</code> and <code>href</code>, and it goes in the <code>&lt;head&gt;</code>.</li>
<li>A script uses <code>&lt;script&gt;</code> and <code>src</code>, and it goes at the end of the <code>&lt;body&gt;</code>.</li>
<li><code>&lt;script&gt;</code> always needs a closing <code>&lt;/script&gt;</code>, even when nothing is inside it.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="112" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h1 id="conclusion">Conclusion</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="113" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
<h2 id="summary">Summary</h2>
<ul>
<li><code>let</code> variables can change, and <code>const</code> variables can't.</li>
<li><code>prompt()</code> gives back a string, and <code>Number()</code> turns it into a number.</li>
<li><code>+</code> and template literals join strings.</li>
<li><code>%</code> gives the remainder, and math inside parentheses happens first.</li>
<li><code>toFixed(2)</code> rounds a number to two decimal places.</li>
<li>A function runs only when we call it.</li>
<li>Arguments go into parameters in order, as copies.</li>
<li><code>return</code> gives a value back to the code that called the function.</li>
<li><code>&lt;script src=&quot;script.js&quot;&gt;</code> links a JavaScript file to the page.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="114" style="--paginate:true;--theme:default;" data-marpit-pagination-total="114">
