<h1 id="css-layout">CSS: Layout</h1>
<p>Colan Biemer</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="the-page-so-far">The Page So Far</h2>
<div class="side-by-side">
<div class="plain">
<div class="header"><h1>Colan's Coffee Blog</h1></div>
<div class="nav"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></div>
<div class="article"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></div>
<div class="aside">Ad</div>
</div>
<div class="sketch">
<div class="header">header</div>
<div class="nav">nav</div>
<div class="article">article</div>
<div class="aside">ad</div>
<div class="footer">footer</div>
</div>
</div>
<p>We have learned how to make the website on the left, but what we want is for our page to be in the format of what we see on the right. This format is known as the <a href="https://alistapart.com/article/holygrail/">&quot;holy grail&quot; layout</a>. (It earned the name because it used to be incredibly difficulty to build, but, as we'll see, that isn't the case today.)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-DFIDTffa="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="review-block-boxes-stack">Review: Block Boxes Stack</h2>
<div class="plain">
<p class="box">A paragraph is a block box. It takes the full width of its parent, even when the text is short.</p>
<p class="box">A <span class="box">span</span> is an inline box. It is only as wide as its content, and it sits in the line of text with the words around it.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="review-block-boxes-stack-continued">Review: Block Boxes Stack (Continued)</h2>
<table>
<thead>
<tr>
<th>Block boxes</th>
<th>Inline boxes</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>&lt;h1&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;ul&gt;</code>, <code>&lt;li&gt;</code>, <code>&lt;div&gt;</code>, <code>&lt;section&gt;</code></td>
<td><code>&lt;a&gt;</code>, <code>&lt;span&gt;</code>, <code>&lt;img&gt;</code>, <code>&lt;strong&gt;</code>, <code>&lt;em&gt;</code></td>
</tr>
</tbody>
</table>
<p>A block box starts on a new line and takes the full width. Every region of the page is a block box, so each one lands under the one before it: the page is a <strong>stack</strong> of boxes, top to bottom. Layout is the job of putting block boxes side by side instead.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="tables-for-layouts">Tables for Layouts</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">table</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">tr</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">td</span> <span class="hljs-attr">colspan</span>=<span class="hljs-string">&quot;3&quot;</span>&gt;</span>Colan&#x27;s Coffee Blog<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">tr</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">tr</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">td</span>&gt;</span>the nav links<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">td</span>&gt;</span>the reviews<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">td</span>&gt;</span>the ad<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">tr</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">tr</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">td</span> <span class="hljs-attr">colspan</span>=<span class="hljs-string">&quot;3&quot;</span>&gt;</span>Copyright 2026<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">tr</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">table</span>&gt;</span>
</code></pre>
<p>Three rows. The header and footer cells span all three columns with <code>colspan</code>. The middle row is the three columns.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-color-the-cells">Problem: Color the Cells</h2>
<div class="demo window">
<table>
<tr><td colspan="3"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td>Ad</td>
</tr>
<tr><td colspan="3">Copyright 2026</td></tr>
</table>
</div>
<p>The table with the page's content in its cells and no CSS. The dashed box is the browser window. Cells have no background, so nothing shows where one region ends and the next begins. How do we color each region?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-color-the-cells">Solution: Color the Cells</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">td</span> <span class="hljs-attr">colspan</span>=<span class="hljs-string">&quot;3&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;head&quot;</span>&gt;</span>...<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">td</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;side&quot;</span>&gt;</span>...<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">td</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;main&quot;</span>&gt;</span>...<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.head</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-built_in">rgb</span>(<span class="hljs-number">43</span>, <span class="hljs-number">26</span>, <span class="hljs-number">14</span>);
  <span class="hljs-attribute">color</span>: <span class="hljs-built_in">rgb</span>(<span class="hljs-number">246</span>, <span class="hljs-number">231</span>, <span class="hljs-number">210</span>);
}
<span class="hljs-selector-class">.side</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-built_in">rgb</span>(<span class="hljs-number">230</span>, <span class="hljs-number">201</span>, <span class="hljs-number">168</span>);
}
<span class="hljs-selector-class">.main</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-built_in">rgb</span>(<span class="hljs-number">251</span>, <span class="hljs-number">243</span>, <span class="hljs-number">232</span>);
}
</code></pre>
</div>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
</div>
<p>One class for each rule to set the color. In this case, the top and the bottom share the same color. The navigation and ad sides also share the same color.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-xM5k6YRQ="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-gaps-between-the-cells">Problem: Gaps Between the Cells</h2>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
<p>The browser puts 2px of space between table cells, and the white page shows through it. This demo widens the gaps to 10px so they are easy to see. How do we close the gaps?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-u5TcgOGR="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-border-collapse">Solution: <code>border-collapse</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">table</span> {
  <span class="hljs-attribute">border-collapse</span>: collapse;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/border-collapse"><code>border-collapse</code></a></td>
<td><code>separate</code> (default), <code>collapse</code></td>
</tr>
</tbody>
</table>
</div>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
</div>
<p><code>collapse</code> makes neighboring cells share their edges, so the space between them is gone.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-70aUgWXr="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

<p>A table is only as wide as its content, so it stops short of the right edge of the window. How do we make it span the window?</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-0I2Chynl="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

<p>A percentage width is a share of the parent's width. The table's parent is the <code>&lt;body&gt;</code>, which spans the window.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-aqgCPhGt="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

<p>Cells in a row are the same height, so the nav and ad cells are as tall as the reviews cell. A cell puts its content in its vertical middle by default, so the nav links and the ad sit halfway down. How do we move them to the top?</p>

<p><code>vertical-align</code> places a cell's content inside the cell. The cells keep their height; only the content moves.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-jLQRBS85="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-the-page-ends-early">Problem: The Page Ends Early</h2>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
<p>The table is as tall as its content, and the window below the footer is empty. How do we put the footer at the bottom of the window?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-ieZU5ARp="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-height-100vh">Solution: <code>height: 100vh</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">body</span> {
  <span class="hljs-attribute">margin</span>: <span class="hljs-number">0</span>;
}
<span class="hljs-selector-tag">table</span> {
  <span class="hljs-attribute">height</span>: <span class="hljs-number">100vh</span>;
}
</code></pre>
</div>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
</div>
<p><code>vh</code> is 1% of the window's height, so <code>100vh</code> is the whole window. Browsers give the <code>&lt;body&gt;</code> an 8px margin on every side by default. That adds 8px above the table and 8px below it, so the page would be 16px taller than the window and scroll. <code>margin: 0</code> removes the margin. The footer is at the bottom now, but look at the header.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-NqMZwhjz="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-the-header-and-footer-grow">Problem: The Header and Footer Grow</h2>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr>
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
<p>The browser shares the extra height among all three rows, so the header and the footer get taller along with the middle row. How do we give all of the extra height to the middle row?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-j9uroXfA="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-a-height-for-the-middle-row">Solution: A Height for the Middle Row</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">tr</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;middle&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">tr</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.middle</span> {
  <span class="hljs-attribute">height</span>: <span class="hljs-number">100%</span>;
}
</code></pre>
</div>
<div class="demo window">
<table>
<tr><td colspan="3" class="head"><h1>Colan's Coffee Blog</h1></td></tr>
<tr class="middle">
<td class="side"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></td>
<td class="main"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></td>
<td class="side">Ad</td>
</tr>
<tr><td colspan="3" class="head">Copyright 2026</td></tr>
</table>
</div>
</div>
<p>The middle row asks for the whole table's height. The header and footer rows keep the height their content needs, and the middle row gets the rest.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="why-it-didnt-work-out">Why It Didn't Work Out</h2>
<ul>
<li><code>&lt;table&gt;</code> was built for data in rows and columns, so a screen reader announces the page as a table of data [<a href="https://www.w3.org/WAI/WCAG21/Techniques/failures/F49">WCAG F49</a>].</li>
<li>HTML should hold the content, and CSS should decide where it goes. With a table, the layout lives in the HTML, so changing the layout means changing the markup on every page.</li>
<li>What if we want a different layout for different screen sizes? On a small screen, maybe we want the nav links moved into the header while the ad stays on the right. On a phone, maybe we want the ad at the top, then the header, then the content stacked below. Each of these moves cells to different rows, and a table's rows are in the HTML, so we can't do it without rewriting the HTML.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-T0bDldnr="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="after-table-layouts-float">After Table Layouts: <code>float</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">img</span> {
  <span class="hljs-attribute">float</span>: left;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/float"><code>float</code></a></td>
<td><code>none</code> (default), <code>left</code>, <code>right</code></td>
</tr>
</tbody>
</table>
</div>
<div class="demo">
<img src="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' fill='%23e6c9a8'/&gt;&lt;circle cx='44' cy='50' r='30' fill='%23fbf3e8'/&gt;&lt;circle cx='44' cy='50' r='24' fill='%236b4226'/&gt;&lt;circle cx='80' cy='50' r='9' fill='none' stroke='%23fbf3e8' stroke-width='6'/&gt;&lt;/svg&gt;" alt="A cup of coffee, seen from above" />
<p>Here is some text about the purpose of my made-up blog. I drink a lot of coffee, and I have opinions about where. Every review is one shop, one drink, and one rating out of five. The list grows each time I find a new place, and the ratings change each time I go back.</p>
</div>
</div>
<p><code>float</code> takes a box out of the stack and pushes it to one side. What comes after it moves up and flows around it instead of starting below it. Wrapping text around an image is the job <code>float</code> was built for (<a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Floats">MDN</a>).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="our-page-in-five-boxes">Our Page in Five Boxes</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;header&quot;</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Colan&#x27;s Coffee Blog<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;nav&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>Visited<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    <span class="hljs-comment">&lt;!-- ... --&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;article&quot;</span>&gt;</span>the reviews<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;ad&quot;</span>&gt;</span>the ad<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;footer&quot;</span>&gt;</span>Copyright 2026<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<p>Five block boxes, one per region, and each <code>class</code> is a hook for CSS. Float three of them and the layout from the first slide comes out, with no table anywhere.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-three-columns">Problem: Three Columns</h2>
<div class="demo">
<div class="header"><h1>Colan's Coffee Blog</h1></div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-tETaNYex="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-three-columns">Solution: Three Columns</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.nav</span>,

</div>
<div class="demo">

<div class="article"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></div>

<div class="footer">Copyright 2026</div>
</div>
</div>
<p>Three columns and no table. <code>width</code> is required: a floated box shrinks to fit its content otherwise. Now look at the footer.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-6thgnIJv="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-the-footer-climbs-up">Problem: The Footer Climbs Up</h2>
<div class="demo">
<div class="header"><h1>Colan's Coffee Blog</h1></div>
<div class="nav"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></div>
<div class="article"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></div>
<div class="ad">Ad</div>
<div class="footer">Copyright 2026</div>
</div>
<br />
<p>The footer's text sits beside the columns and its dark box is behind them. The three floats were pulled out of the stack, so the footer's box starts right under the header, and its text flows around the floats the way the paragraph flowed around the image. How do we get the footer below all three columns?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-7F3GByyA="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-clear">Solution: <code>clear</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.footer</span> {
  <span class="hljs-attribute">clear</span>: both;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/clear"><code>clear</code></a></td>
<td><code>none</code> (default), <code>left</code>, <code>right</code>, <code>both</code></td>
</tr>
</tbody>
</table>
</div>
<div class="demo">
<div class="header"><h1>Colan's Coffee Blog</h1></div>
<div class="nav"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></div>
<div class="article"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></div>
<div class="ad">Ad</div>
<div class="footer">Copyright 2026</div>
</div>
</div>
<p><code>clear: both</code> moves the footer down until no float is beside it on either side. <code>clear: left</code> only drops below the floats on the left, and <code>clear: right</code> only below the floats on the right.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-y6O3DaGR="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-the-image-pokes-out-of-its-box">Problem: The Image Pokes Out of Its Box</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;card&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;cortado.png&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;A cortado&quot;</span> /&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Recreo - Dynamite.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>The next paragraph starts here.<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.card</span> {
  <span class="hljs-attribute">border</span>: <span class="hljs-number">2px</span> solid <span class="hljs-built_in">rgb</span>(<span class="hljs-number">201</span>, <span class="hljs-number">123</span>, <span class="hljs-number">58</span>);
}
<span class="hljs-selector-tag">img</span> {
  <span class="hljs-attribute">float</span>: left;
}
</code></pre>
</div>
<div>
<div class="demo">
<div class="card">
<img src="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' fill='%23e6c9a8'/&gt;&lt;circle cx='44' cy='50' r='30' fill='%23fbf3e8'/&gt;&lt;circle cx='44' cy='50' r='24' fill='%236b4226'/&gt;&lt;circle cx='80' cy='50' r='9' fill='none' stroke='%23fbf3e8' stroke-width='6'/&gt;&lt;/svg&gt;" alt="A cup of coffee, seen from above" />
<p>Recreo - Dynamite. The cortado is the best in town.</p>
</div>
<p>The next paragraph on the page starts here, and it wraps around the image too.</p>
</div>
</div>
</div>
<p>The card's border closes above the bottom of the image, and the next paragraph wraps around the part that sticks out. A floated child does not count toward its parent's height. How do we make the card grow to hold the image?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-uNhRUv5h="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-display-flow-root">Solution: <code>display: flow-root</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.card</span> {
  <span class="hljs-attribute">border</span>: <span class="hljs-number">2px</span> solid <span class="hljs-built_in">rgb</span>(<span class="hljs-number">201</span>, <span class="hljs-number">123</span>, <span class="hljs-number">58</span>);
  <span class="hljs-attribute">display</span>: flow-root;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/display"><code>display</code></a></td>
<td><code>block</code>, <code>inline</code>, <code>flow-root</code>, and more</td>
</tr>
</tbody>
</table>
</div>
<div class="demo">
<div class="card">
<img src="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;rect width='100' height='100' fill='%23e6c9a8'/&gt;&lt;circle cx='44' cy='50' r='30' fill='%23fbf3e8'/&gt;&lt;circle cx='44' cy='50' r='24' fill='%236b4226'/&gt;&lt;circle cx='80' cy='50' r='9' fill='none' stroke='%23fbf3e8' stroke-width='6'/&gt;&lt;/svg&gt;" alt="A cup of coffee, seen from above" />
<p>Recreo - Dynamite. The cortado is the best in town.</p>
</div>
<p>The next paragraph on the page starts here, below the card.</p>
</div>
</div>
<p><code>flow-root</code> makes the card hold its floats: the card's height now counts the floated image, so the border closes below it and the next paragraph starts below the card.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-eiVgwcgz="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-ragged-bottoms">Problem: Ragged Bottoms</h2>
<div class="demo padded">
<div class="header"><h1>Colan's Coffee Blog</h1></div>
<div class="nav"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></div>
<div class="article"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li></ul></div>
<div class="ad">Ad</div>
<div class="footer">Copyright 2026</div>
</div>
<p>Look at the bottoms of the three columns. The nav's tan box stops after three links, the ad's after one line, and the article keeps going. Make all three columns end on the same line, the way the table's cells did.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-DAc4vsdu="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-fake-it">Solution: Fake It</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.columns</span> {
  <span class="hljs-attribute">display</span>: flow-root;
  <span class="hljs-attribute">background</span>: <span class="hljs-built_in">linear-gradient</span>(
    to right,
    <span class="hljs-built_in">rgb</span>(<span class="hljs-number">230</span>, <span class="hljs-number">201</span>, <span class="hljs-number">168</span>) <span class="hljs-number">20%</span>,
    <span class="hljs-built_in">rgb</span>(<span class="hljs-number">251</span>, <span class="hljs-number">243</span>, <span class="hljs-number">232</span>) <span class="hljs-number">20%</span> <span class="hljs-number">80%</span>,
    <span class="hljs-built_in">rgb</span>(<span class="hljs-number">230</span>, <span class="hljs-number">201</span>, <span class="hljs-number">168</span>) <span class="hljs-number">80%</span>
  );
}
</code></pre>
<p>The wrapper is as tall as the tallest column, so its striped background (<a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/gradient/linear-gradient"><code>linear-gradient</code></a>) reaches the footer. The boxes underneath are still ragged, and the wrapper <code>&lt;div&gt;</code> exists only for the layout.</p>
</div>
<div>
<div class="demo padded">
<div class="header"><h1>Colan's Coffee Blog</h1></div>
<div class="columns">
<div class="nav"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></div>
<div class="article"><h2>Visited</h2><p>Here is some text about the purpose of my made-up blog.</p><ul><li>Recreo - Dynamite</li><li>Nero - at least it looks nice.</li><li>Starbucks - it's fine.</li><li>Blue Bottle - worth the line.</li><li>Peet's - strong.</li></ul></div>
<div class="ad">Ad</div>
</div>
<div class="footer">Copyright 2026</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;columns&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;nav&quot;</span>&gt;</span>...<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;article&quot;</span>&gt;</span>...<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;ad&quot;</span>&gt;</span>...<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="what-floats-fixed">What Floats Fixed</h2>
<ul>
<li><strong>Pro:</strong> the layout is in CSS, not HTML.</li>
<li><strong>Con:</strong> every fix needed another fix. The footer needs <code>clear: both</code>, the box around the columns needs <code>display: flow-root</code>, and equal-height columns need a wrapper <code>&lt;div&gt;</code> with a painted background.</li>
<li><strong>Con:</strong> the widths are percentages that must add up to 100%, and <code>width</code> leaves out padding and border unless <code>box-sizing: border-box</code> is set. Adding a fourth column means changing the width of every other column so the total is still 100%.</li>
<li><strong>Con:</strong> moving one column can move another. Floats fill in from the edges in source order, so after <code>.nav { float: right; }</code> the ad slides to the middle.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="summary-floats">Summary: Floats</h2>
<ul>
<li><code>float: left</code> or <code>right</code> pulls a box out of the stack and lets what follows flow around it. Wrapping text around an image is the job it was built for</li>
<li>Three floated boxes with widths make three columns</li>
<li>The first box after the columns needs <code>clear: both</code>, or it climbs up beside them</li>
<li>A box that holds floats needs <code>display: flow-root</code> to grow around them; without it, its height counts only the children that are not floating</li>
<li><code>width</code> leaves out padding and border unless <code>* { box-sizing: border-box; }</code></li>
<li>Columns of the same height have to be faked with a background painted on a wrapper</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-is-this-semantic-html">Problem: Is This Semantic HTML?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;header&quot;</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Colan&#x27;s Coffee Blog<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;nav&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>Visited<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;article&quot;</span>&gt;</span>the reviews<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;ad&quot;</span>&gt;</span>the ad<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;footer&quot;</span>&gt;</span>Copyright 2026<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<p>Three columns, a footer that stays put, and every rule in the CSS. Read the HTML on its own, without the class names, and say what each box holds.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-is-this-semantic-html">Solution: Is This Semantic HTML?</h2>
<table>
<thead>
<tr>
<th>Element</th>
<th>Holds</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/header"><code>&lt;header&gt;</code></a></td>
<td>the top of the page: title, logo</td>
</tr>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/nav"><code>&lt;nav&gt;</code></a></td>
<td>links to the rest of the site</td>
</tr>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/article"><code>&lt;article&gt;</code></a></td>
<td>the content itself</td>
</tr>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/aside"><code>&lt;aside&gt;</code></a></td>
<td>something beside the content: an ad, a related link</td>
</tr>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/footer"><code>&lt;footer&gt;</code></a></td>
<td>the bottom of the page: copyright, contact</td>
</tr>
</tbody>
</table>
<p>No. A <code>&lt;div&gt;</code> means &quot;some box&quot; and nothing else, and <code>class=&quot;nav&quot;</code> is invisible to everything but CSS. What is inside still carries meaning, since a <code>&lt;ul&gt;</code> of links is a list of links either way, but the box around it is anonymous. HTML already has names for these five.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="semantic-html-update">Semantic HTML Update</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">header</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>Colan&#x27;s Coffee Blog<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">header</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">nav</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>Visited<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>Recreo - Dynamite<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>Nero - at least it looks nice.<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">footer</span>&gt;</span>Copyright 2026<span class="hljs-tag">&lt;/<span class="hljs-name">footer</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="semantic-html-update-continued">Semantic HTML Update (Continued)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">nav</span>, <span class="hljs-selector-tag">article</span>, <span class="hljs-selector-tag">aside</span> { <span class="hljs-attribute">float</span>: left; }
<span class="hljs-selector-tag">footer</span> { <span class="hljs-attribute">clear</span>: both; }
</code></pre>
<p>Rather than selecting by class, we can select by tag with very similar CSS to before.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="six-boxes">Six Boxes</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;boxes&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>4<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>5<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>6<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
</div>
<p>Six <code>&lt;div&gt;</code>s, numbered 1 to 6, inside a <code>&lt;div class=&quot;boxes&quot;&gt;</code>. Each one is a block box, so they stack.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-AZ8kn6WU="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="a-layout-system">A Layout System</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.boxes</span> {
  <span class="hljs-attribute">display</span>: grid;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/display"><code>display</code></a></td>
<td><code>block</code>, <code>inline</code>, <code>grid</code>, <code>flex</code>, <code>none</code></td>
</tr>
</tbody>
</table>
</div>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
</div>
<p>Grid is the first part of CSS built for page layout, and every browser has had it since 2017. <code>display: grid</code> on the parent makes it a <strong>grid container</strong>; its children become <strong>grid items</strong>. With no columns declared, the grid is one column wide, so nothing visible changes yet.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-mv0uNe0m="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="columns-grid-template-columns">Columns: <code>grid-template-columns</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.boxes</span> {
  <span class="hljs-attribute">display</span>: grid;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">50%</span> <span class="hljs-number">50%</span>;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-template-columns"><code>grid-template-columns</code></a></td>
<td>one width per column: <code>50% 50%</code></td>
</tr>
</tbody>
</table>
</div>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
</div>
<p>Two values, two columns. The boxes fill the cells in HTML order: left to right, then the next row.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-glOEn4GE="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-three-columns-again">Problem: Three Columns, Again</h2>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
<p>Change the grid to three columns: 20%, 60% and 20% of the width, the same columns as the float layout.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-4WhJojjB="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="solution-three-columns-again">Solution: Three Columns, Again</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.boxes</span> {
  <span class="hljs-attribute">display</span>: grid;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">20%</span> <span class="hljs-number">60%</span> <span class="hljs-number">20%</span>;
}
</code></pre>
</div>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
</div>
<p>Three values, three columns. No <code>width</code> on the boxes, no <code>float</code>, no <code>clear</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-q7sC6Ddf="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="the-fr-unit">The <code>fr</code> Unit</h2>
<div class="side-by-side">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr;
</code></pre>
<div class="boxes a">
<div>1</div>
<div>2</div>
<div>3</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">1</span>fr <span class="hljs-number">2</span>fr <span class="hljs-number">1</span>fr;
</code></pre>
<div class="boxes b">
<div>1</div>
<div>2</div>
<div>3</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">200px</span> <span class="hljs-number">1</span>fr;
</code></pre>
<div class="boxes c">
<div>1</div>
<div>2</div>
</div>
</div>
<p><code>1fr</code> is one share of the space left after the fixed columns are placed (<a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/flex_value"><code>fr</code></a>). Three <code>1fr</code> columns are equal thirds; <code>1fr 2fr 1fr</code> gives the middle column twice the width of the others. The shares divide whatever space is left after the fixed columns and the gaps, so there is no arithmetic to get wrong.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-scope-gBFD5sdH="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="space-between-cells-gap">Space Between Cells: <code>gap</code></h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.boxes</span> {
  <span class="hljs-attribute">display</span>: grid;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">3</span>, <span class="hljs-number">1</span>fr);
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">10px</span>;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/gap"><code>gap</code></a></td>
<td>one length (<code>10px</code>), or two: rows then columns (<code>10px 20px</code>)</td>
</tr>
</tbody>
</table>
</div>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
</div>
<p><code>gap</code> goes on the container and only puts space between cells, never around the outside. <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/row-gap"><code>row-gap</code></a> and <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/column-gap"><code>column-gap</code></a> set one direction. <code>grid-gap</code> is the old name for <code>gap</code> and still works.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-scope-1o0LBWpT="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="rows">Rows</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.boxes</span> {
  <span class="hljs-attribute">display</span>: grid;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">3</span>, <span class="hljs-number">1</span>fr);
  <span class="hljs-attribute">grid-template-rows</span>: <span class="hljs-number">50px</span> <span class="hljs-number">120px</span>;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">10px</span>;
}
</code></pre>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-template-rows"><code>grid-template-rows</code></a></td>
<td>one height per row: <code>50px 120px</code></td>
</tr>
</tbody>
</table>
</div>
<div class="boxes">
<div>1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
</div>
<p>Rows work the same way as columns. Rows you do not list are made as the boxes need them, and they size themselves to their content.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-Jl12SClf="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="grid-lines">Grid Lines</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;boxes&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;wide&quot;</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  ...
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.wide</span> {
  <span class="hljs-attribute">grid-column</span>: <span class="hljs-number">1</span> / <span class="hljs-number">4</span>;
}
</code></pre>
</div>
<div>
<div class="linenums"><span>1</span><span>2</span><span>3</span><span>4</span></div>
<div class="boxes">
<div class="wide">1</div>
<div>2</div>
<div>3</div>
<div>4</div>
<div>5</div>
<div>6</div>
</div>
<table>
<thead>
<tr>
<th>Property</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-column"><code>grid-column</code></a>, <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-row"><code>grid-row</code></a></td>
<td><code>1 / 4</code>, <code>3</code>, <code>span 2</code></td>
</tr>
</tbody>
</table>
</div>
</div>
<p>Column lines are numbered from 1 at the left edge, so three columns have lines 1 to 4. <code>grid-column: 1 / 4</code> stretches box 1 from line 1 to line 4. <code>1 / span 3</code> says the same thing by counting columns instead of naming the end line. <code>grid-row</code> numbers the lines between rows the same way.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-scope-bSMa2ydm="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="problem-the-holy-grail">Problem: The Holy Grail</h2>

<p>Back to the blog, with <code>body { display: grid; grid-template-columns: 1fr 3fr 1fr; gap: 10px; }</code>:</p>
<div class="demo padded">
<div class="header"><h1>Colan's Coffee Blog</h1></div>
<div class="nav"><ul><li><a href="#">Visited</a></li><li><a href="#">Wishlist</a></li><li><a href="#">About</a></li></ul></div>

<div class="ad">Ad</div>
<div class="footer">Copyright 2026</div>
</div>
<p><code>&lt;body&gt;</code> is the container, so its five children are the items. They fill the cells in order: header, nav, article, then the ad and the footer. Put the header and the footer across all three columns.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-AV4o2SgC="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

}

<div class="ad">Ad</div>
<div class="footer">Copyright 2026</div>
</div>
</div>
<p>Header on top, footer on the bottom, three columns between: the holy grail in nine lines. The nav and the ad fill their row's full height, so the columns end on the same line for free, the way the table's cells did.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-marpit-scope-HWC6cRJ9="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

<div class="demo padded">
<div class="header"><h1>Colan's Coffee Blog</h1></div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-scope-N1db79eg="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="first-try-columns-only">First Try: Columns Only</h2>
<div class="side-by-side">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">nav</span> {

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-scope-WHFZRv36="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-scope-QRiVs3kQ="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

<span class="hljs-selector-tag">footer</span>  { <span class="hljs-attribute">grid-column</span>: <span class="hljs-number">1</span> / <span class="hljs-number">3</span>; <span class="hljs-attribute">grid-row</span>: <span class="hljs-number">4</span>; }

</div>
<p>Nav above the ad on the left, the article beside both. It works, and every rule is a pair of coordinates. To read it, you draw the grid on paper. To add a row above the nav, you change five numbers.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">
<h2 id="name-the-areas">Name the Areas</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">body</span> {

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-marpit-scope-DMUHGRo4="" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:default;" data-marpit-pagination-total="72">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.boxes</span> {

}
</code></pre>
<p><code>stretch</code>, the default, is why every box has filled its cell so far. <code>align-</code> moves boxes up and down, <code>justify-</code> left and right. <code>-items</code> on the container sets every item; <code>-self</code> on one item overrides it.</p>

<td><code>stretch</code> (default), <code>start</code>, <code>center</code>, <code>end</code></td>

</tr>

<h2 id="media-queries">Media Queries</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-keyword">@media</span> (<span class="hljs-attribute">max-width</span>: <span class="hljs-number">600px</span>) {
  <span class="hljs-comment">/* rules in here apply only while the window is at most 600px wide */</span>
}
</code></pre>
<table>
<thead>
<tr>
<th>Rule</th>
<th>Condition</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media"><code>@media</code></a></td>
<td><code>(max-width: 600px)</code>, <code>(min-width: 601px)</code>, and more</td>
</tr>
</tbody>
</table>
<p><code>@media</code> wraps rules in a condition: they switch on at 600px and under, and off above it. A phone also needs one line of HTML, already in the starter file:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;viewport&quot;</span> <span class="hljs-attr">content</span>=<span class="hljs-string">&quot;width=device-width, initial-scale=1&quot;</span> /&gt;</span>
</code></pre>
<p>Without it, a phone lays the page out about 980px wide and shrinks it to fit (<a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport">MDN</a>), and the media query never fires.</p>
</section>

<p><code>display: none</code> removes the box entirely. A removed box is not a grid item, so <code>&quot;aside&quot;</code> comes out of the picture too, or the row stays behind as a gap. Hiding a box hides it from screen readers too, so drop only what the page can spare.</p>

<h2 id="summary-layout">Summary: Layout</h2>
<ul>
<li>Block boxes stack. A table or a float can put them side by side, and each one costs a list of workarounds</li>
<li><code>display: grid</code> on the parent; <code>grid-template-columns</code> with <code>px</code>, <code>fr</code>, and <code>repeat()</code>; <code>gap</code> for the space between</li>
<li><code>grid-column: 1 / 4</code> places by line number; <code>grid-template-areas</code> and <code>grid-area</code> place by name, and the CSS reads like the layout</li>
<li><code>align-self</code> and <code>justify-self</code> move a box inside its cell; <code>-items</code> on the container does it for all of them</li>
<li><code>@media (max-width: 600px)</code> swaps in a different picture on a narrow screen; the HTML never changes</li>
</ul>
